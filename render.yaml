# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: settlewise-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    # Seeding is idempotent, so it is safe to run on every start.
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      # Document reading. Set LLM_PROVIDER to none to use only the built-in pattern reader.
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-5.5
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
